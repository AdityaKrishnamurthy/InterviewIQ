<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#00D4AA" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E" />
      <stop offset="100%" stop-color="#0F0F1A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#2A2A3E" stroke-width="2" />
  
  <!-- Outer glowing accent ring -->
  <rect x="3" y="3" width="58" height="58" rx="14" stroke="url(#iqGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Brain / Intelligence node spark lines -->
  <path d="M20 32C20 25.3726 25.3726 20 32 20C38.6274 20 44 25.3726 44 32C44 38.6274 38.6274 44 32 44" stroke="url(#iqGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Central AI Pulse / Waveform -->
  <circle cx="32" cy="32" r="4" fill="#00D4AA" />
  <circle cx="24" cy="32" r="2.5" fill="#6C63FF" />
  <circle cx="40" cy="32" r="2.5" fill="#6C63FF" />
  
  <!-- Modern IQ Lightning Spark -->
  <path d="M30 14L34 22H29L33 30" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M31 34L35 42H30L34 50" stroke="#6C63FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>