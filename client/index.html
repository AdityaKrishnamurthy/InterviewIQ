<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterviewIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600;700;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('interviewiq-theme');
          if (!t) {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Not a dashboard — a record. Every answer becomes testimony
      cross-examined against the resume's claims; refuses the soft-glow
      AI-SaaS-purple default.
      OWN-WORLD: Paper-toned document panels (warm ivory, near-black ink) on
      a near-black desk ground even in dark mode; monospace transcript type
      with line-numbered margins; exhibit-stamp buttons (rectangular,
      ink-stamp corner, decisive snap on press); one sealed-red accent for
      truthfulness flags; snap-step state transitions, never soft eases.
      STORY: An answer is stamped into the record with a timestamp/line
      number; when the truthfulness checker or interview memory calls back
      to an earlier line, a literal connecting rule draws to it; the final
      report reads as a ruling, not a scorecard.
      FIRST VIEWPORT: Dashboard opens as a case docket — past sessions as
      numbered case files, not soft-shadow cards.
      FORM: candidate 5 of 7 (own ranked list), seed key 893de270.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
