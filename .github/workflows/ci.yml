name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run server tests
        run: npm run test:server

      - name: Run client tests
        run: npm run test:client

      - name: Build client
        run: npm run build --workspace=client
